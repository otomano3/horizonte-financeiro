<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 96" width="135" height="96" role="img" aria-label="Horizonte Financeiro">
  <title>Horizonte Financeiro: símbolo</title>
  <!-- Símbolo isolado, sem o disco: o horizonte mais a linha de crescimento.
       Usa currentColor, então herda a cor do texto onde for aplicado.
       Cor oficial do símbolo: dourado #F5A623. -->
  <g fill="currentColor" color="#f5a623">
    <path d="M6.5 56.5A53.5 53.5 0 0 1 113.5 56.5Z" fill="currentColor"/>
    <path d="M6.5 89 34 70 52 82 80 49 96 64 127.5 17"
          fill="none" stroke="currentColor" stroke-width="10.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="127.5" cy="17" r="6.2" fill="currentColor"/>
  </g>
</svg>
